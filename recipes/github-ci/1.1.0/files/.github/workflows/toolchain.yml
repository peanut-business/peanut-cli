name: Registered Application Toolchain

# Called from this recipe's manual workflows at the same commit.
on:
  workflow_call:
    inputs:
      task:
        required: true
        type: string

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      HUSKY: '0'
      PEANUT_CI_TASK: ${{ inputs.task }}
      PEANUT_CACHE_ROOT: ${{ runner.temp }}/peanut-package-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read project tool requirements and application layout
        id: requirements
        run: |
          set -euo pipefail
          case "$PEANUT_CI_TASK" in ci|package) ;; *) echo 'Unsupported task' >&2; exit 2;; esac
          for path in \
            .peanut/application-manifest.json resources/project-resources.json \
            server/composer.json server/composer.lock server/database/install.php \
            scripts/project-composer scripts/project-env scripts/upgrade \
            tools/toolchain.json web/package.json web/pnpm-lock.yaml; do
            test -f "$path"
          done
          for client in platform pc uniapp; do
            if test -d "$client"; then
              test -f "$client/package.json"
              test -f "$client/package-lock.json"
            fi
          done
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          result = subprocess.run([sys.executable, 'scripts/project-env', 'requirements'], text=True, capture_output=True, check=True)
          required = json.loads(result.stdout)
          extensions = required['php'].get('extensions', [])
          if not all(isinstance(x, str) and re.fullmatch(r'[A-Za-z0-9_]+', x) for x in extensions):
              raise SystemExit('Invalid PHP extension requirement')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for name in ('node', 'npm', 'pnpm', 'php', 'composer', 'python3'):
                  version = required[name]['version']
                  if not re.fullmatch(r'\d+\.\d+\.\d+', version):
                      raise SystemExit('Exact tool version required: ' + name)
                  print(name + '=' + version, file=output)
              print('php_extensions=' + ','.join(extensions), file=output)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.requirements.outputs.python3 }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.requirements.outputs.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.requirements.outputs.pnpm }}
          run_install: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.requirements.outputs.php }}
          extensions: ${{ steps.requirements.outputs.php_extensions }}
          tools: none
          coverage: none
        env:
          fail-fast: 'true'
      - name: Restore package caches only
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/peanut-package-cache/pnpm
            ${{ runner.temp }}/peanut-package-cache/npm
            ${{ runner.temp }}/peanut-package-cache/composer
          key: ${{ runner.os }}-${{ runner.arch }}-peanut-packages-v1-${{ hashFiles('tools/toolchain.json', 'scripts/project-composer', 'web/package.json') }}-${{ hashFiles('server/composer.lock', 'web/pnpm-lock.yaml', 'platform/package-lock.json', 'pc/package-lock.json', 'uniapp/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-peanut-packages-v1-${{ hashFiles('tools/toolchain.json', 'scripts/project-composer', 'web/package.json') }}-
      - name: Bind this disposable runner and prepare the registered environment
        run: |
          set -euo pipefail
          # Preparation is explicit and uses the repository's checksum-pinned PHAR.
          bash scripts/project-composer prepare
          python3 - <<'PY'
          import json, os, shutil, subprocess, sys
          from pathlib import Path
          root = Path.cwd().resolve()
          required = json.loads(subprocess.check_output([sys.executable, 'scripts/project-env', 'requirements'], text=True))
          def program(name):
              value = shutil.which(name)
              if value is None:
                  raise SystemExit('Provisioned tool missing: ' + name)
              return str(Path(value).resolve(strict=True))
          node, php = program('node'), program('php')
          cache_root = Path(os.environ['PEANUT_CACHE_ROOT']).resolve()
          caches = {name: str(cache_root / name) for name in ('pnpm', 'npm', 'composer')}
          for path in caches.values():
              Path(path).mkdir(parents=True, exist_ok=True)
          commands = {
              'node': [node], 'npm': [node, program('npm')], 'pnpm': [node, program('pnpm')],
              'php': [php], 'python3': [str(Path(sys.executable).resolve())],
              'composer': [php, str(root / '.local/toolchain' / ('composer-' + required['composer']['version'] + '.phar'))],
          }
          # Only explicitly provisioned tools are discovered here; prepare verifies
          # their exact versions. A bundled npm mismatch fails rather than upgrading.
          binding = {'schema_version': 1, 'commands': commands,
                     'extra_path': ['/usr/local/bin', '/usr/bin', '/bin'],
                     'caches': caches, 'watch_paths': []}
          target = root / '.local/toolchain/host.json'
          fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w', encoding='utf-8') as output:
              json.dump(binding, output, indent=2)
              output.write('\n')
          PY
          python3 scripts/project-env prepare
      - name: Validate locked backend
        if: inputs.task == 'ci'
        run: |
          python3 scripts/project-env exec -- bash -euo pipefail -c '
            composer validate --working-dir=server
            composer install --working-dir=server --no-interaction --no-progress --prefer-dist --no-scripts
            find server/app server/database -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          '
      - name: Build shipped clients from locked dependencies
        if: inputs.task == 'ci'
        run: |
          python3 scripts/project-env exec -- bash -euo pipefail -c '
            (cd web && pnpm install --frozen-lockfile && pnpm run build)
            if test -d platform; then (cd platform && npm ci && npm run build); fi
            if test -d pc; then (cd pc && npm ci && npm run build); fi
            if test -d uniapp; then (cd uniapp && npm ci && npm run build:h5); fi
          '
      - name: Prepare the committed APP server through its existing release engine
        if: inputs.task == 'package'
        run: |
          python3 scripts/project-env exec -- bash scripts/package-release.sh \
            "$RUNNER_TEMP/application-release" --application-root="$GITHUB_WORKSPACE" --server-only
      - uses: actions/upload-artifact@v4
        if: inputs.task == 'package'
        with:
          name: application-server-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/application-release.tar.gz
            ${{ runner.temp }}/application-release.tar.gz.manifest.json
          if-no-files-found: error
          retention-days: 7
